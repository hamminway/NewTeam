<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--header-->
<th:block th:fragment="header">
    <div class="header_wrap">
        <div class="con sort">
            <div class="column">

            <div class="first_column flex-row">
                <div class="header_logo">
                    <a th:href="@{/}" class="logo block cell">
                        <img th:src="@{/img/main_logo.jpg}" alt="로고">
                    </a>
                </div>

                <div class="user">
                    <a href="#">
                        <img id="header_weather" th:src="@{/img/weather.png}" alt="날씨아이콘">25.2&#176;</a>
                    <a sec:authorize="isAnonymous()" href="/members/login">로그인</a>
                    <a sec:authorize="isAuthenticated()" href="/members/logout">로그아웃</a>
                    <a sec:authorize="isAnonymous()" th:href="@{/members/new}" class="join">회원가입</a>
                    <a sec:authorize="isAuthenticated()" href="#">나의 페이지</a>
                </div>
                <form class="icon" th:action="@{/search/searchList}" method="get">
                    <input name="searchQuery" type="search"  placeholder="검색" class="mini-search">
                    <button class="icon-search-btn" type="submit">
                        <i class="fa-solid fa-magnifying-glass" style="color: #7eff38;"></i>
                    </button>
                </form>
            </div>

            <nav class="second_column cell-right flex-row">
                <div class="flex-row menu-box" id="target">
                    <div class="cell dum">
                        <span class="block"></span>
                    </div>

                    <div class="cell">
                        <a href="#" class="header-text">컬처</a>
                        <div class="relative">
                            <ul>
                                <li><a href="#" class="block disable">예술</a></li>
                                <li><a href="#" class="block disable">원데이 클래스</a></li>
                            </ul>
                        </div>
                        <div class="menu-text">
                            <span class="menu-title">Culture</span>
                            <span class="menu-title-text">문화</span>
                        </div>
                    </div>
                    <div class="cell">
                        <a href="#" class="header-text">푸드</a>
                        <div class="relative">
                            <ul>
                                <li><a href="#" class="block disable">카페</a></li>
                                <li><a href="#" class="block disable">휴게 음식점</a></li>
                                <li><a href="#" class="block disable">일반 음식점</a></li>
                            </ul>
                        </div>
                        <div class="menu-text blind">
                            <span class="menu-title">Food</span>
                            <span class="menu-title-text">음식</span>
                        </div>
                    </div>
                    <div class="cell">
                        <a href="#" class="header-text">쉘터</a>
                        <div class="relative">
                            <ul>
                                <li><a href="#" class="block disable">모텔</a></li>
                                <li><a href="#" class="block disable">호텔/리조트</a></li>

                                <li><a href="#" class="block disable">글램핑/캠핑장</a></li>
                                <li><a href="#" class="block disable">게스트 하우스</a></li>
                            </ul>

                            <span class="menu-title">Shelter</span>

                    </div>
                    <div class="cell">
                        <a href="#" class="header-text">그 외</a>
                        <div class="relative">
                            <ul>
                                <li><a href="#" class="block disable">액티비티</a></li>
                                <li><a href="#" class="block disable">공지사항</a></li>
                            </ul>
                        </div>
                        <div class="menu-text blind">
                            <span class="menu-title">ETC</span>
                            <span class="menu-title-text">그 외(기타)</span>
                        </div>
                    </div>
                </div>

            </div>

</th:block><!-- header -->
